<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../static/styles.css">
    <link rel="stylesheet" href="/static/styles.css">
    <title>Portfolio Summary</title>
</head>

<header>
    {% include 'top_bar.html' %}
</header>

<body>
    <h1>Portfolio Summary</h1>

    <div class="table_wrapper">
        <table id="projectTable">
            <thead>
                <tr>
                    <th>Project Name</th>
                    <th>Department</th>
                    <th>
                        <a href="{{ url_for('projects', sort_by='hcount', direction=next_direction['hcount']) }}">
                            Headcount {{ arrows['hcount']}}
                        </a>
                    </th>
                    <th>
                        <a href="{{ url_for('projects', sort_by='thours', direction=next_direction['thours']) }}">
                            Total Hours{{ arrows['thours']}}
                        </a>
                    </th>
                </tr>
            </thead>
            <tbody>
                <!-- TODO: add links for project names that link to project details page-->
                {% for proj in project_list %}
                <tr>
                    <td>
                        <a class="project-link" href="{{ url_for('proj_details', pname=proj[0]) }}">{{ proj[0] }}</a>
                    </td>
                    <td>{{ proj[1] }}</td>
                    <td>{{ proj[2] }}</td>
                    <td>{{ proj[3] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
